<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
    }

    .full-img {
      position: relative;
      width: 400px;
      margin: 0 auto;
    }

    .displayed-img {
      width: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0);
      z-index: 1;
    }
    button {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      padding: 5px 10px;
      cursor: pointer;
    }

    .thumb-bar {
      width: 400px;
      margin: 20px auto;
      display: flex;
      gap: 5px;
    }

    .thumb-bar img {
      width: 70px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Image gallery example</h1>
  <div class="full-img">
    <img
      class="displayed-img"
      src="https://mdn.github.io/shared-assets/images/examples/learn/gallery/pic1.jpg"
      alt="Closeup of a human eye">
    <div class="overlay"></div>
    <button class="dark">Darken</button>
  </div>
  <div class="thumb-bar"></div>
  <script src="someodd.js"></script>
</body>
</html>
